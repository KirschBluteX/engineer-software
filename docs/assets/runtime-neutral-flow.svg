<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Engineer Software dual-runtime flow</title>
  <desc id="desc">One canonical skill source is projected to Codex and DeepSeek Harness while shared references and evaluations stay common.</desc>
  <defs>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="runtime" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 600 20px Segoe UI, Arial, sans-serif; fill: #0f172a; }
      .small { font: 400 16px Segoe UI, Arial, sans-serif; fill: #334155; }
      .light { font: 600 20px Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .light-small { font: 400 16px Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .box { stroke: #94a3b8; stroke-width: 2; rx: 18; }
    </style>
  </defs>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="label">Runtime-neutral, evidence-driven workflow</text>

  <rect x="70" y="105" width="300" height="170" fill="url(#core)" class="box" stroke="#0f172a"/>
  <text x="220" y="151" text-anchor="middle" class="light">Canonical source</text>
  <text x="220" y="188" text-anchor="middle" class="light-small">SKILL.md + references</text>
  <text x="220" y="218" text-anchor="middle" class="light-small">one owner, checked drift</text>
  <text x="220" y="248" text-anchor="middle" class="light-small">shared routing evals</text>

  <rect x="470" y="80" width="290" height="150" fill="url(#runtime)" class="box"/>
  <text x="615" y="124" text-anchor="middle" class="label">Codex entry</text>
  <text x="615" y="157" text-anchor="middle" class="small">plugin.json + marketplace</text>
  <text x="615" y="190" text-anchor="middle" class="small">native skill catalog</text>

  <rect x="470" y="285" width="290" height="150" fill="url(#runtime)" class="box"/>
  <text x="615" y="329" text-anchor="middle" class="label">Harness entry</text>
  <text x="615" y="362" text-anchor="middle" class="small">.dsh/skills projection</text>
  <text x="615" y="395" text-anchor="middle" class="small">developer-preview contract</text>

  <rect x="870" y="180" width="260" height="180" fill="#ecfeff" class="box" stroke="#67e8f9"/>
  <text x="1000" y="225" text-anchor="middle" class="label">Evidence surface</text>
  <text x="1000" y="260" text-anchor="middle" class="small">same route cases</text>
  <text x="1000" y="291" text-anchor="middle" class="small">same module references</text>
  <text x="1000" y="322" text-anchor="middle" class="small">fresh verification</text>

  <path d="M370 170 C410 150 430 150 470 150" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M370 225 C415 300 425 350 470 350" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 155 C820 155 825 220 870 235" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M760 360 C820 360 825 315 870 305" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="170" y="410" width="860" height="120" fill="#fff" class="box"/>
  <text x="600" y="453" text-anchor="middle" class="label">No runtime-specific workflow fork</text>
  <text x="600" y="487" text-anchor="middle" class="small">Only the loading projection changes; evidence and module semantics remain shared.</text>
</svg>
