name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Run release gates
        run: |
          python scripts/validate_plugin.py plugins/engineer-software
          python scripts/validate_evals.py
          python scripts/validate_project.py
          python -m unittest discover -s tests -v
      - name: Check tag matches manifest release base
        shell: python
        run: |
          import json
          import os
          from pathlib import Path

          version = json.loads(
              Path("plugins/engineer-software/.codex-plugin/plugin.json").read_text()
          )["version"].split("+", 1)[0]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match manifest base v{version}")
      - name: Package plugin
        run: |
          mkdir -p dist
          cd plugins
          zip -r "../dist/engineer-software-${GITHUB_REF_NAME}.zip" engineer-software
      - uses: actions/upload-artifact@v4
        with:
          name: engineer-software-${{ github.ref_name }}
          path: dist/*.zip
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes

